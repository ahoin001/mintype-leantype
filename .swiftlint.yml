included:
  - App
  - KeyboardExtension
  - Packages/LeanTypeKit/Sources
  - Packages/LeanTypeKit/Tests

excluded:
  - .tools
  - build
  - DerivedData

opt_in_rules:
  - closure_spacing
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - modifier_order
  - private_over_fileprivate
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unowned_variable_capture
  - weak_delegate

disabled_rules:
  - todo

line_length:
  warning: 120
  error: 160

identifier_name:
  excluded: [id, x, y, dx, dy, r, g, b, a]

type_body_length:
  warning: 300

file_length:
  warning: 500
