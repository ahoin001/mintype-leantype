name: LeanType

options:
  bundleIdPrefix: com.leantype
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  LeanTypeKit:
    path: Packages/LeanTypeKit

targets:
  LeanType:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - target: LeanTypeKeyboard
      - package: LeanTypeKit
        product: LeanTypeCore
      - package: LeanTypeKit
        product: LeanTypeDesign
      - package: LeanTypeKit
        product: LeanTypeKeyboardUI
    entitlements:
      path: App/LeanType.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.leantype.shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LeanType
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leantype.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LeanTypeKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: KeyboardExtension
    dependencies:
      - package: LeanTypeKit
        product: LeanTypeCore
      - package: LeanTypeKit
        product: LeanTypeDesign
      - package: LeanTypeKit
        product: LeanTypeKeyboardUI
    entitlements:
      path: KeyboardExtension/LeanTypeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.leantype.shared
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: LeanType
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leantype.app.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES

schemes:
  LeanType:
    build:
      targets:
        LeanType: all
        LeanTypeKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: LeanTypeKit/LeanTypeCoreTests
    archive:
      config: Release
